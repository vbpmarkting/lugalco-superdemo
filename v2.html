<body>
<p class="lg-demo" data-t="demo">Demo: datos, tarifas y envases provisionales</p>
<header class="lg-header">
  <a href="#" class="lg-logo" data-home aria-label="Lugalco, inicio"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M4 13c6-7 11 7 17 0s11 7 16 0M4 21c6-7 11 7 17 0s11 7 16 0M4 29c6-7 11 7 17 0s11 7 16 0" stroke="currentColor" stroke-width="2.5"/></svg> lugalco</a>
  <nav class="lg-nav" aria-label="Principal"><a href="#lugalco" data-t="navLugalco">Lugalco</a><a href="#lab" data-t="navLab">Umami Lab</a><a href="#productos" data-t="navProducts">Productos</a><a href="#como-pedir" data-t="navHow">Cómo pedir</a></nav>
  <div class="lg-langs" role="group" aria-label="Idioma"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button></div>
  <a class="lg-btn" data-client href="cliente.html" data-t="clientArea">Área cliente</a>
</header>
<main>
<section class="v2-hero" aria-label="Lugalco"><div class="v2-grid">
  <div><p class="v2-kicker" data-t="heroKicker">Lugalco · Vigo</p>
    <h1 data-t="heroTitle">Congelado en origen.
Listo para tu cocina.</h1>
    <p class="v2-lead" data-t="heroLead"></p>
    <div class="v2-actions"><a class="lg-btn lg-btn-strong" href="#lab" data-t="labTitle">Umami Lab</a><a class="lg-btn lg-btn-strong lg-btn-ghost" data-client href="cliente.html" data-t="askQuote">Pedir cotización</a></div>
    <ul class="v2-stats" data-stats></ul></div>
  <div class="v2-stage"><div class="v2-pack"><img id="v2-img" src="assets/productos-demo/serie-umami/frontal-patata-99.webp" alt="Envase Umami Patata 9/9"></div>
    <div class="v2-stage-bar" id="v2-bar"></div></div>
</div></section>
<script>
(function(){var ids=[['patata-99','Patata 9/9'],['gamba-pelada','Gamba'],['pollo-empanado','Pollo'],['hamburguesa','Hamburguesa'],['menestra-comun','Menestra']];
var bar=document.getElementById('v2-bar'),im=document.getElementById('v2-img');
bar.innerHTML=ids.map(function(i,n){return '<button type="button" data-id="'+i[0]+'" aria-pressed="'+(n===0)+'">'+i[1]+'</button>'}).join('');
bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;im.style.opacity=0;setTimeout(function(){im.src='assets/productos-demo/serie-umami/frontal-'+b.dataset.id+'.webp';im.alt='Envase Umami '+b.textContent;im.style.opacity=1},180);bar.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})});})();
</script>
<div id="lg-sections"></div>
</main>
